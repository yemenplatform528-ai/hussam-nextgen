name: Hussam NextGen CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install locked baseline tooling
        run: python -m pip install -r requirements.lock
      - name: Install project
        run: python -m pip install -e '.[test]'
      - name: Repository baseline audit
        run: python scripts/baseline_audit.py
      - name: Compile Python sources
        run: python -m compileall -q app alembic tests
      - name: Run tests
        run: python -m pytest -q
      - name: Fresh SQLite migration
        env:
          DATABASE_URL: sqlite:////tmp/hussam-nextgen-ci.db
        run: alembic upgrade head
      - name: Alembic schema drift check
        env:
          DATABASE_URL: sqlite:////tmp/hussam-nextgen-ci.db
        run: alembic check
      - name: Release artifact manifest
        run: python scripts/artifact_manifest.py . /tmp/release-manifest.json
      - name: Python dependency consistency
        run: python -m pip check
      - name: Dependency vulnerability audit
        run: |
          python -m pip install pip-audit
          pip-audit

  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: hussam
          POSTGRES_USER: hussam
          POSTGRES_PASSWORD: ci-pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hussam -d hussam"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install project
        run: |
          python -m pip install -r requirements.lock
          python -m pip install -e '.[test]'
      - name: PostgreSQL migration
        env:
          DATABASE_URL: postgresql+psycopg://hussam:ci-pass@127.0.0.1:5432/hussam
        run: alembic upgrade head
      - name: PostgreSQL schema drift
        env:
          DATABASE_URL: postgresql+psycopg://hussam:ci-pass@127.0.0.1:5432/hussam
        run: alembic check
      - name: PostgreSQL integration tests
        env:
          DATABASE_URL: postgresql+psycopg://hussam:ci-pass@127.0.0.1:5432/hussam
        run: python -m pytest -q tests/test_production_persistence.py tests/test_core_persistence.py

  container-security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Build release container
        run: docker build -t hussam-nextgen:ci .
      - name: Scan release container
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: hussam-nextgen:ci
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL,HIGH
