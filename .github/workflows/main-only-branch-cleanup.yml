name: Temporary main-only branch cleanup

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    if: ${{ !contains(github.event.head_commit.message, 'main-only branch cleanup') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Delete every remote branch except main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git ls-remote --heads origin | sed 's#.*refs/heads/##' | while IFS= read -r branch; do
            if [ "$branch" != "main" ]; then
              echo "Deleting $branch"
              gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${branch}"
            fi
          done
      - name: Verify only main remains
        run: |
          set -euo pipefail
          branches=$(git ls-remote --heads origin | sed 's#.*refs/heads/##')
          printf '%s\n' "$branches"
          test "$(printf '%s\n' "$branches" | grep -c '^main$')" -eq 1
          test "$(printf '%s\n' "$branches" | grep -vc '^main$')" -eq 0
      - name: Remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/main-only-branch-cleanup.yml
          git commit -m "chore: main-only branch cleanup"
          git push