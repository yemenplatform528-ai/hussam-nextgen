name: Temporary Poetry lock bootstrap

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  bootstrap:
    if: ${{ !contains(github.event.head_commit.message, 'Poetry lock bootstrap cleanup') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install Poetry
        run: python -m pip install poetry==2.5.1
      - name: Generate Poetry lock
        run: poetry lock
      - name: Commit lock and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add poetry.lock
          git rm .github/workflows/poetry-lock-bootstrap.yml
          git commit -m "build: add Poetry lock bootstrap cleanup"
          git push