name: Hussam Runner V1 isolated PostgreSQL prototype

on:
  pull_request:
    paths:
      - "app/runner/**"
      - "tests/runner/**"
      - ".github/workflows/runner-prototype.yml"
      - "docs/ADR-0001-runner-v1-vs-v4.md"

permissions:
  contents: read

jobs:
  runner-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: runner_test
          POSTGRES_USER: runner_test
          POSTGRES_PASSWORD: runner_test_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U runner_test -d runner_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install isolated test dependencies
        run: python -m pip install "psycopg[binary]>=3.2,<4" "pytest>=8" "croniter>=2,<7"
      - name: Create prototype schema in disposable PostgreSQL
        env:
          PGPASSWORD: runner_test_only
        run: psql -h 127.0.0.1 -U runner_test -d runner_test -v ON_ERROR_STOP=1 -f app/runner/schema.sql
      - name: Run queue, RLS, fencing, checkpoint and recovery tests
        env:
          RUNNER_TEST_DATABASE_URL: postgresql://runner_test:runner_test_only@127.0.0.1:5432/runner_test
        run: python -m pytest -q tests/runner
