name: Transport canonical bundle to main

on:
  push:
    branches:
      - transport/canonical-bundle-2026-09-23

permissions:
  contents: write

jobs:
  deliver:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout transport branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify bundle checksum
        shell: bash
        run: |
          set -euo pipefail
          expected='038855c2e3e9833f83ec52d32054a6d33cb81a38be2752e4701478f11a8b910f'
          actual="$(sha256sum Hussam-NextGen-Engineering-Certification-Control-Verified-2026-09-23.bundle | awk '{print $1}')"
          test "$actual" = "$expected"

      - name: Verify bundle and canonical HEAD
        shell: bash
        run: |
          set -euo pipefail
          git bundle verify Hussam-NextGen-Engineering-Certification-Control-Verified-2026-09-23.bundle
          rm -rf /tmp/canonical
          git clone Hussam-NextGen-Engineering-Certification-Control-Verified-2026-09-23.bundle /tmp/canonical
          cd /tmp/canonical
          test "$(git rev-parse HEAD)" = '473cb7785bf2853e884a3ed28ea17f18d5085efa'
          test "$(git rev-parse HEAD^{tree})" = '32f622c7e90b1a2a917e915c298d1f1c2afcc8ce'
          test "$(git ls-tree -r --name-only HEAD | wc -l | tr -d ' ')" = '392'
          test -z "$(git status --porcelain)"

      - name: Push verified canonical commit to main
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git -C /tmp/canonical remote add github "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git -C /tmp/canonical fetch github main
          test "$(git -C /tmp/canonical rev-parse github/main)" = '7f988306ee64aab714960a24b6d4ecdcdc54b152'
          git -C /tmp/canonical push github '473cb7785bf2853e884a3ed28ea17f18d5085efa:refs/heads/main'
