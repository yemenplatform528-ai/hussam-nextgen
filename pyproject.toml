[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hussam-nextgen"
version = "1.0.0"
description = "Hussam Yemeni Sovereign Platform NextGen operational HUS compiler and AI control plane"
requires-python = ">=3.11"
dependencies = [
    "psycopg[binary]>=3.2,<4.0",
    "alembic>=1.13,<2.0",
    "fastapi[standard]>=0.115",
    "uvicorn>=0.30",
    "sqlalchemy>=2.0",
    "pydantic>=2.0",
    "PyJWT[crypto]>=2.8,<3.0",
    "redis>=5,<7"
]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27", "playwright>=1.50,<2.0"]

[tool.fastapi]
entrypoint = "app.api.main:app"

[tool.setuptools.packages.find]
include = ["app", "app.*"]
exclude = ["tests*", "config*", "alembic*", "evidence*"]

[tool.pytest.ini_options]
pythonpath = ["."]