<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>الحسام اليمني ⚔️🇾🇪</title><style>body{margin:0;background:#0b1020;color:#eef2ff;font-family:system-ui,sans-serif}main{max-width:920px;margin:auto;padding:22px 16px}.card{background:#121a30;border:1px solid #273352;border-radius:16px;padding:15px;margin:12px 0}.muted{color:#aab3cc}.chat{max-height:50vh;overflow:auto}.msg{padding:10px;margin:8px 0;border-radius:12px;background:#18233d}.composer{display:flex;gap:8px}.composer input{flex:1;padding:12px;background:#0b1020;color:#fff;border:1px solid #354260;border-radius:10px}button{padding:10px 14px;background:#18233d;color:#fff;border:1px solid #354260;border-radius:10px}#login{position:fixed;inset:0;background:#080d19ee;display:grid;place-items:center;padding:20px}#login .box{max-width:420px;width:100%;background:#121a30;border:1px solid #354260;border-radius:18px;padding:20px;box-sizing:border-box}#token{width:100%;box-sizing:border-box;padding:12px;background:#0b1020;color:#fff;border:1px solid #354260;border-radius:10px;margin:10px 0}</style></head><body><div id="login"><div class="box"><h2>دخول المالك</h2><p class="muted">النواة المستقلة تعمل بوضع محمي. أدخل رمز الوصول المضبوط على الخادم.</p><input id="token" type="password" placeholder="رمز الوصول"><button onclick="login()">دخول</button><p id="err"></p></div></div><main><h1>الحسام اليمني ⚔️🇾🇪</h1><p class="muted">Yemen Intelligence Bridge — WORLD · Independent Core</p><div class="card"><b>TRUTH-FIRST · FAIL-CLOSED</b><p class="muted">اليمن هو الغاية؛ الذكاء الاصطناعي طبقة قدرة قابلة للاستبدال.</p><pre id="state">جارٍ التحقق…</pre></div><div class="card"><h3>المحادثة والاستمرارية</h3><div id="chat" class="chat"></div><div class="composer"><input id="input" placeholder="اكتب رسالتك…"><button onclick="send()">إرسال</button><button onclick="exportState()">تصدير</button></div></div></main><script>let auth=sessionStorage.getItem('yib_access_token')||'';const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));const api=(p,o={})=>{o.headers={...(o.headers||{}),Authorization:'Bearer '+auth};return fetch(p,o)};async function login(){const v=document.getElementById('token').value.trim();if(!v)return;auth=v;const r=await api('/api/state');if(r.status!==200){auth='';document.getElementById('err').textContent='رمز الوصول غير صحيح.';return}sessionStorage.setItem('yib_access_token',auth);document.getElementById('login').style.display='none';refresh()}async function refresh(){if(!auth)return;const r=await api('/api/state');if(r.status===401){sessionStorage.removeItem('yib_access_token');auth='';document.getElementById('login').style.display='grid';return}const s=await r.json();document.getElementById('state').textContent=JSON.stringify(s,null,2);const c=await (await api('/api/chat')).json();document.getElementById('chat').innerHTML=(c.messages||[]).map(x=>'<div class="msg"><b>'+esc(x.role)+'</b><br>'+esc(x.content)+'</div>').join('')}async function send(){const i=document.getElementById('input'),v=i.value.trim();if(!v)return;await api('/api/chat',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({content:v})});i.value='';refresh()}async function exportState(){const r=await api('/api/export');const b=new Blob([JSON.stringify(await r.json(),null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='YIB-WORLD-handoff.json';a.click()}if(auth){document.getElementById('login').style.display='none';refresh()}</script></body></html>
